model:
  target: models.autoencoders.autoencoder.VQModel
  params:
    optim_lr: 4.5e-6 
    embed_dim: 128 # Dimensionality of the latent space embeddings produced by the quantizer. This determines the size of each embedding vector.
    n_embed: 512 # The number of discrete embeddings (or "codebook entries") in the quantizer. Larger values allow for more representational capacity.
    include_edges: False
    edge_detector_config: False
      # target: edge_detector.meijering_torch import EdgeDetector
      # params:
    ddconfig:
      use_sigmoid: False
      double_z: False # Determines whether the latent space has twice the dimensionality. When True, the latent space includes both mean and variance (e.g., for variational autoencoders).
      z_channels: 256 # Number of channels in the latent representation (i.e., dimensionality of the bottleneck feature map after encoding).
      resolution: 256 # Resolution (height and width) of input and output images. 
      in_channels: 3 # Number of input image channels. 
      out_ch: 3 # Number of output image channels. 
      ch: 64 # Base number of feature channels in the network. This is multiplied by scaling factors to determine the number of channels at different layers.
      ch_mult: [ 1,2,2,4]  # num_down = len(ch_mult)-1; Multipliers for the number of channels at each level of the encoder/decoder.
      num_res_blocks: 1 # Number of residual blocks per level in the encoder and decoder. Residual blocks help improve gradient flow and learning stability.
      attn_resolutions: [8] # List of resolutions (in pixels) at which attention layers are applied. For example, at 16×16 spatial resolution, attention mechanisms are introduced.
      dropout: 0.0 # Dropout probability for regularization. A value of 0.0 means no dropout is used.
    loss:
      target: models.autoencoders.losses.disc_loss.VQLPIPSWithDiscriminator
      params:
        disc_conditional: False
        disc_in_channels: 3 # The number of input channels to the discriminator (3 for RGB)
        disc_start_iter: 1000 # The number of **iterations** after which the discriminator kicks in # TODO: less than 5000 but higher than 1000 (for two gpus)
        disc_weight: 0.5 #  The weight of the discriminator loss in the overall loss function.
        codebook_weight: 1.0 # The weight of the codebook loss in the overall loss function.
        percept_loss:
          target: models.autoencoders.losses.retfound_loss.RETFound_LPIPS
          params:
            normalize: True # Whether to normalize the input images before computing the perceptual loss.
            retfound_weight: 0.5
            retfound_start_iter: 1




